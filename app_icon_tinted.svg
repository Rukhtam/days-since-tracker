<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS 18 Tinted Variant - Grayscale for system tinting -->
  <defs>
    <linearGradient id="tintGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#313131;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle - Pure black for tinting -->
  <circle cx="512" cy="512" r="448" fill="#000000"/>

  <!-- Progress Ring Active - Grayscale gradient -->
  <circle
    cx="512"
    cy="512"
    r="324"
    fill="none"
    stroke="url(#tintGradient)"
    stroke-width="72"
    stroke-linecap="round"
    stroke-dasharray="1527 509"
    transform="rotate(-90 512 512)"
  />

  <!-- Number "7" - Grayscale gradient -->
  <text
    x="512"
    y="630"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="420"
    font-weight="700"
    fill="url(#tintGradient)"
    text-anchor="middle"
  >7</text>
</svg>
