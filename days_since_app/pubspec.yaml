name: days_since_tracker
description: "A minimal tracker app to monitor days since recurring events like haircuts, oil changes, and more."
publish_to: 'none'

version: 1.0.18+19

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Local Storage - Hive for fast, lightweight persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management - Provider for simplicity and reliability
  provider: ^6.1.2

  # Unique ID generation
  uuid: ^4.5.1

  # Local Notifications for reminders
  flutter_local_notifications: ^19.5.0

  # Timezone support for scheduled notifications
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

  # Permission handling
  permission_handler: ^11.3.1

  # Haptic feedback
  vibration: ^2.0.0

  # Modern UI fonts
  google_fonts: ^6.1.0

  # Circular progress indicator
  percent_indicator: ^4.2.3

  # Package info for version display
  package_info_plus: ^8.0.0

  # Device info for diagnostics
  device_info_plus: ^11.0.0

  # Share functionality for diagnostics
  share_plus: ^10.0.0

  # URL launcher for opening external links
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  # App icon generation
  flutter_launcher_icons: ^0.13.1

  # Native splash screen generation
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  # Asset directories for icon and splash
  assets:
    - assets/icon/
    - assets/splash/

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

  # Android adaptive icon (Android 8.0+)
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_background: "#1A1A1A"

  # Android monochrome icon (Material You theming)
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

  # iOS specific - remove alpha channel for App Store compliance
  remove_alpha_ios: true

  # Web favicon (optional)
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1A1A1A"
    theme_color: "#4CAF50"

# Splash Screen Configuration
flutter_native_splash:
  # Background color matching app dark theme
  color: "#121212"

  # Splash icon (centered)
  image: "assets/splash/splash_icon.png"

  # Android 12+ specific splash screen
  android_12:
    image: "assets/splash/splash_icon.png"
    icon_background_color: "#1A1A1A"
    image_dark: "assets/splash/splash_icon.png"
    icon_background_color_dark: "#0A0A0A"

  # iOS specific
  ios_content_mode: "center"

  # Platform support
  android: true
  ios: true
  web: false
